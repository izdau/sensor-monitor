spring:
  application.name: warehouse-service
  main.keep-alive: true # keep the JVM alive until UDP listeners and Kafka threads are stopped on shutdown
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

conf:
  warehouse-id: warehouse-1
  sensor.temperature-port: 3344
  sensor.humidity-port: 3355
  kafka.topic: sensor-measurements

